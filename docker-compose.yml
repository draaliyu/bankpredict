
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bankuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bankpredict}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bankuser} -d ${DB_NAME:-bankpredict}"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    profiles: ["serve"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${API_KEY:-}
    restart: unless-stopped

volumes:
  postgres_data:
